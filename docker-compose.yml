services:
  requirements-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OpenAI__ApiKey=${OPENAI_API_KEY}
      - OpenAI__BaseUrl=https://api.openai.com/v1
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  retro-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: dotnet RetroAnalyzer.Api.dll
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OpenAI__ApiKey=${OPENAI_API_KEY}
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s

  meeting-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: dotnet MeetingAnalyzer.Api.dll
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OpenAI__ApiKey=${OPENAI_API_KEY}
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s

  sdm-assistant:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: dotnet SDMAssistant.Api.dll
    ports:
      - "7006:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OpenAI__ApiKey=${OPENAI_API_KEY:-}
      - Jira__BaseUrl=${JIRA_BASE_URL:-}
      - Jira__Username=${JIRA_USERNAME:-}
      - Jira__ApiToken=${JIRA_API_TOKEN:-}
      - Confluence__BaseUrl=${CONFLUENCE_BASE_URL:-}
      - Confluence__Username=${CONFLUENCE_USERNAME:-}
      - Confluence__ApiToken=${CONFLUENCE_API_TOKEN:-}
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s

  devops-assistant:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: dotnet DevOpsAssistant.Api.dll
    ports:
      - "7007:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OpenAI__ApiKey=${OPENAI_API_KEY:-}
      - GitHub__Token=${GITHUB_TOKEN:-}
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s

  image-refinement-api:
    build:
      context: .
      dockerfile: src/ImageRefinementAssistant/ImageRefinementAssistant.Api/Dockerfile
      target: development
    command: dotnet watch run --urls "http://+:8080"
    ports:
      - "5011:8080"
      - "5012:5000"  # Debug port
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - OpenAI__ApiKey=${OPENAI_API_KEY}
      - OpenAI__BaseUrl=https://api.openai.com/v1
      - DOTNET_USE_POLLING_FILE_WATCHER=true
    env_file:
      - .env
    volumes:
      - ./src/ImageRefinementAssistant:/src/src/ImageRefinementAssistant
      - ./shared:/src/shared
      - ./logs:/app/logs
      - image-refinement-api-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/imagerefinement/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - image-refinement-network

  image-refinement-web:
    build:
      context: .
      dockerfile: src/ImageRefinementAssistant/ImageRefinementAssistant.Web/Dockerfile
      target: development
    command: dotnet watch run --urls "http://+:8080"
    ports:
      - "5010:8080"
      - "5013:5001"  # Debug port
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ApiBaseUrl=http://image-refinement-api:8080
      - DOTNET_USE_POLLING_FILE_WATCHER=true
    env_file:
      - .env
    volumes:
      - ./src/ImageRefinementAssistant:/src/src/ImageRefinementAssistant
      - ./shared:/src/shared
      - ./logs:/app/logs
    depends_on:
      - image-refinement-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - image-refinement-network

volumes:
  logs:
  image-refinement-api-data:

networks:
  image-refinement-network:
    driver: bridge
